<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MY WORKOUT">

<title>MY WORKOUT</title>

<style>
:root{
  --bg:#0d0f14;
  --card:#171a21;
  --card2:#111318;
  --line:#292d37;
  --text:#ffffff;
  --muted:#8f98a8;
  --blue:#3a86ff;
  --green:#67d391;
  --yellow:#ffcc66;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:680px;
  margin:auto;
  padding:18px 14px 100px;
}

h1{
  margin:4px 0;
  font-size:30px;
}

.subtitle{
  color:#999;
  margin-bottom:18px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.small-btn{
  border:1px solid var(--line);
  background:#171a21;
  color:#d9deea;
  border-radius:10px;
  padding:9px 12px;
  font-weight:700;
}

.day-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}

.day-btn{
  flex:0 0 auto;
  border:none;
  border-radius:12px;
  padding:10px 14px;
  background:#1b1e26;
  color:#aaa;
  font-weight:800;
}

.day-btn.active{
  background:var(--blue);
  color:white;
}

.today-card{
  background:linear-gradient(135deg,#17233b,#11151f);
  border:1px solid #263b63;
  padding:18px;
  border-radius:18px;
  margin-bottom:18px;
}

.small{
  color:#9aa7bd;
  font-size:13px;
}

.today-title{
  font-size:28px;
  font-weight:900;
  margin:5px 0;
}

.day-note{
  color:#b9c5d8;
  font-size:13px;
  margin-top:6px;
  line-height:1.5;
}

.draft-badge{
  font-size:12px;
  color:var(--yellow);
  margin-top:8px;
  min-height:15px;
}

.exercise{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
}

.exercise.main-ex{
  border-color:#315d9e;
}

.exercise.activation{
  border-color:#665927;
}

.exercise-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.exercise-title{
  font-size:18px;
  font-weight:900;
}

.badge{
  display:inline-block;
  font-size:10px;
  padding:3px 7px;
  border-radius:8px;
  margin-left:5px;
  vertical-align:2px;
}

.badge-main{
  background:#183e72;
  color:#8fc1ff;
}

.badge-pre{
  background:#4b4218;
  color:#ffe17a;
}

.exercise-info{
  font-size:13px;
  color:var(--muted);
  margin:5px 0 10px;
}

.link-btn{
  border:1px solid #364056;
  background:#10131a;
  color:#8fb7ff;
  border-radius:9px;
  padding:7px 9px;
  font-weight:700;
  font-size:12px;
}

.previous{
  background:var(--card2);
  padding:10px 11px;
  border-radius:10px;
  margin-bottom:10px;
  color:#aeb6c5;
  font-size:13px;
  line-height:1.55;
}

.previous strong{
  color:#70a7ff;
}

.copy-last{
  width:100%;
  border:1px solid #343a47;
  background:#12151b;
  color:#c8cfdd;
  border-radius:9px;
  padding:8px;
  margin:-2px 0 10px;
  font-weight:700;
}

.headers,
.set-row{
  display:grid;
  grid-template-columns:34px 1fr 1fr 1fr;
  gap:6px;
  align-items:center;
}

.headers{
  color:#777;
  font-size:11px;
  text-align:center;
  margin-bottom:5px;
}

.set-row{
  margin-bottom:8px;
}

.set-num{
  color:#888;
  font-size:13px;
}

input{
  width:100%;
  min-width:0;
  padding:10px 5px;
  text-align:center;
  border-radius:9px;
  border:1px solid #333845;
  background:#0d0f14;
  color:white;
  font-size:16px;
}

button.main{
  width:100%;
  border:none;
  border-radius:14px;
  padding:16px;
  margin-top:10px;
  font-size:17px;
  font-weight:900;
}

.save-btn{
  background:#272c36;
  color:white;
}

.complete-btn{
  background:var(--blue);
  color:white;
}

.status{
  text-align:center;
  color:var(--green);
  min-height:22px;
  margin:14px 0;
  font-size:14px;
}

.bottom-info{
  color:#666;
  text-align:center;
  font-size:12px;
  margin-top:26px;
}

.rest-card{
  background:#171a21;
  border:1px solid #33404e;
  border-radius:18px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:18px;
}

.rest-title{
  font-size:28px;
  font-weight:900;
  margin-bottom:10px;
}

.rest-text{
  color:#9ba6b8;
  line-height:1.6;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:1000;
  padding:18px;
  overflow:auto;
}

.modal.show{
  display:block;
}

.modal-card{
  max-width:650px;
  margin:24px auto;
  background:#14171d;
  border:1px solid #2d323d;
  border-radius:18px;
  padding:16px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.modal-title{
  font-size:20px;
  font-weight:900;
}

.close-btn{
  border:none;
  background:#282d36;
  color:white;
  border-radius:10px;
  padding:8px 11px;
  font-weight:800;
}

.history-row{
  background:#0f1116;
  border:1px solid #272c35;
  border-radius:12px;
  padding:11px;
  margin:9px 0;
}

.history-date{
  color:#8f98a8;
  font-size:12px;
  margin-bottom:5px;
}

.history-sets{
  font-size:13px;
  line-height:1.55;
  color:#d8deea;
}

canvas{
  width:100%;
  height:180px;
  background:#0d0f14;
  border:1px solid #292d37;
  border-radius:12px;
  margin:12px 0;
}

.section-title{
  font-weight:900;
  margin:14px 0 8px;
}

.empty{
  color:#777;
  text-align:center;
  padding:24px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>MY WORKOUT</h1>
<div class="subtitle">7 Day Hypertrophy Split · 30+ Sets</div>

<div class="top-actions">

<button class="small-btn" onclick="openSessionHistory()">
전체 기록
</button>

<button class="small-btn" onclick="exportData()">
백업
</button>

<label class="small-btn">
복원

<input
id="restoreFile"
type="file"
accept=".json,application/json"
style="display:none"
onchange="restoreData(event)"
>

</label>

</div>

<div class="day-tabs" id="tabs"></div>

<div class="today-card">

<div class="small">
CURRENT WORKOUT
</div>

<div class="today-title" id="dayTitle"></div>

<div id="daySub"></div>

<div class="day-note" id="dayNote"></div>

<div class="draft-badge" id="draftBadge"></div>

</div>

<div id="exerciseList"></div>

<button
class="main save-btn"
id="draftBtn"
onclick="saveDraft()"
>
현재 기록 임시저장
</button>

<button
class="main complete-btn"
id="completeBtn"
onclick="completeWorkout()"
>
운동 완료 → 다음 DAY
</button>

<div class="status" id="status"></div>

<div class="bottom-info">
메인 운동 = 5세트<br>
일반 운동 = 3세트<br>
선행/활성화 운동 = 2~3세트
</div>

</div>

<div
class="modal"
id="historyModal"
onclick="modalBackgroundClose(event)"
>

<div class="modal-card">

<div class="modal-head">

<div
class="modal-title"
id="historyTitle"
>
기록
</div>

<button
class="close-btn"
onclick="closeModal()"
>
닫기
</button>

</div>

<div id="historyContent"></div>

</div>

</div>

<script>

const routine = [

{
name:"SHOULDER + BI",
sub:"어깨 + 이두",
note:"레이즈 중심 · 프레스 없음 · 케이블 운동은 한 번에 진행",
exercises:[

["익스터널 로테이션",2,"15~20","pre"],

["케이블 사이드레터럴",5,"12~20","main"],

["페이스풀",3,"12~20","normal"],

["Bayesian 케이블 컬",3,"10~15","normal"],

["로프 해머컬",3,"10~15","normal"],

["케이블 리어델트 플라이",3,"12~20","normal"],

["리어델트 머신",5,"10~20","main"],

["이두 머신",3,"8~12","normal"],

["덤벨 사이드레터럴 고반복",3,"20~30","normal"]

]
},

{
name:"CHEST + TRI",
sub:"가슴 + 삼두",
note:"펙덱 선행 → 메인 프레스 2개 → 케이블 블록",
exercises:[

["펙덱 플라이",3,"12~15","pre"],

["스미스 로우인클라인 OR 인클라인프레스 머신",5,"6~10","main"],

["체스트프레스 머신",5,"6~10","main"],

["어시스트 딥스",3,"8~12","normal"],

["케이블 풀오버",2,"12~15","pre"],

["케이블 하이→로우 플라이",3,"10~15","normal"],

["오버헤드 케이블 삼두 익스텐션",3,"10~15","normal"],

["케이블 푸시다운",3,"10~15","normal"],

["한팔 크로스바디 삼두 익스텐션",3,"12~15","normal"]

]
},

{
name:"BACK + HAM",
sub:"등 + 햄스트링/둔근",
note:"암풀다운 선행 → 풀업 → 티바로우 → 케이블 등 → 후면하체",
exercises:[

["암풀다운",2,"12~15","pre"],

["어시스트 풀업",5,"6~10","main"],

["티바로우",5,"6~10","main"],

["한팔 케이블 하이로우",3,"8~12","normal"],

["한팔 케이블 광배로우",3,"10~15","normal"],

["케이블로우",3,"8~12","normal"],

["스미스 RDL",5,"6~10","main"],

["라잉 레그컬",3,"10~15","normal"],

["힙쓰러스트",3,"8~12","normal"]

]
},

{
name:"REST",
sub:"휴식",
note:"웨이트 휴식 · 걷기나 가벼운 스트레칭 정도",
exercises:[]
},

{
name:"PUSH",
sub:"어깨 프레스 + 가슴 + 삼두",
note:"익스터널 로테이션 선행 → 숄더프레스 우선 → 가슴 → 케이블 블록",
exercises:[

["익스터널 로테이션",2,"15~20","pre"],

["숄더프레스 머신",5,"6~10","main"],

["스미스 로우인클라인 OR 인클라인프레스 머신",5,"6~10","main"],

["체스트프레스 머신",3,"8~12","normal"],

["어시스트 딥스",3,"8~12","normal"],

["펙덱 플라이",3,"10~15","normal"],

["케이블 사이드레터럴",3,"12~20","normal"],

["케이블 풀오버",2,"12~15","pre"],

["오버헤드 케이블 삼두 익스텐션",3,"10~15","normal"],

["케이블 푸시다운",3,"10~15","normal"]

]
},

{
name:"PULL + BI",
sub:"등 + 후면어깨 + 이두",
note:"암풀다운 선행 → 풀업 → 티바로우 → 머신 → 케이블 블록",
exercises:[

["암풀다운",2,"12~15","pre"],

["어시스트 풀업",5,"6~10","main"],

["티바로우",5,"6~10","main"],

["케이블로우 머신",3,"8~12","normal"],

["리어델트 머신",3,"12~20","normal"],

["이두 머신",3,"8~12","normal"],

["한팔 케이블 광배로우",3,"10~15","normal"],

["Bayesian 케이블 컬",3,"10~15","normal"],

["로프 해머컬",3,"10~15","normal"]

]
},

{
name:"LEGS",
sub:"쿼드 중심 하체",
note:"이너타이 + 아웃타이 선행 → V스쿼트 → 레그프레스",
exercises:[

["이너타이",2,"15~20","pre"],

["아웃타이",2,"15~20","pre"],

["V스쿼트",5,"6~10","main"],

["레그프레스",5,"8~12","main"],

["레그익스텐션",3,"10~15","normal"],

["스미스 불가리안 스플릿스쿼트",3,"8~12","normal"],

["라잉 레그컬",3,"10~15","normal"],

["카프레이즈",3,"10~15","normal"],

["힙쓰러스트 OR 발 높은 레그프레스",3,"8~12","normal"],

["레그익스텐션 고반복 마무리",3,"15~25","normal"]

]
}

];

let currentDay =
Number(localStorage.getItem("currentDay7") || 0);

let isCompleting = false;

function getHistory(){

try{

return JSON.parse(
localStorage.getItem("workoutHistory7") || "[]"
);

}catch{

return [];

}

}

function setHistory(h){

localStorage.setItem(
"workoutHistory7",
JSON.stringify(h)
);

}

function draftKey(day){

return "draft7_" +
day.replace(/\s+/g,"_");

}

function getDraft(day){

try{

return JSON.parse(
localStorage.getItem(draftKey(day)) || "null"
);

}catch{

return null;

}

}

function setDraft(day,data){

localStorage.setItem(
draftKey(day),
JSON.stringify(data)
);

}

function clearDraft(day){

localStorage.removeItem(
draftKey(day)
);

}

function formatSet(s,i){

return `${i+1}세트 ${s.weight || "-"}kg × ${s.reps || "-"}회 · RIR ${s.rir || "-"}`;

}

function escapeAttr(v){

return String(v)
.replace(/&/g,"&amp;")
.replace(/"/g,"&quot;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}

function renderTabs(){

const tabs =
document.getElementById("tabs");

tabs.innerHTML = "";

routine.forEach((day,index)=>{

const btn =
document.createElement("button");

btn.className =
"day-btn" +
(index === currentDay
? " active"
: "");

btn.innerText =
day.name;

btn.onclick = ()=>{

currentDay = index;

localStorage.setItem(
"currentDay7",
currentDay
);

render();

};

tabs.appendChild(btn);

});

}

function getExerciseHistory(
dayName,
exerciseName
){

return getHistory()
.filter(s => s.day === dayName)
.map(s => {

const ex =
(s.exercises || [])
.find(
e => e.name === exerciseName
);

return ex
? {
date:s.date,
ts:s.ts || 0,
sets:ex.sets || []
}
: null;

})
.filter(Boolean);

}

function findLastExercise(
dayName,
exerciseName
){

const arr =
getExerciseHistory(
dayName,
exerciseName
);

return arr.length
? arr[arr.length - 1]
: null;

}

function render(){

renderTabs();

const day =
routine[currentDay];

document
.getElementById("dayTitle")
.innerText =
day.name;

document
.getElementById("daySub")
.innerText =
day.sub;

document
.getElementById("dayNote")
.innerText =
day.note;

const draft =
getDraft(day.name);

document
.getElementById("draftBadge")
.innerText =
draft
? `임시저장됨 · ${draft.savedAt || ""}`
: "";

const list =
document.getElementById("exerciseList");

list.innerHTML = "";

const draftBtn =
document.getElementById("draftBtn");

const completeBtn =
document.getElementById("completeBtn");

if(day.exercises.length === 0){

draftBtn.style.display = "none";

completeBtn.innerText =
"휴식 완료 → 다음 DAY";

list.innerHTML = `

<div class="rest-card">

<div class="rest-title">
REST DAY
</div>

<div class="rest-text">

웨이트 없음<br><br>

가볍게 걷거나<br>
피로가 있으면 완전 휴식

</div>

</div>

`;

return;

}

draftBtn.style.display = "block";

completeBtn.innerText =
"운동 완료 → 다음 DAY";

day.exercises.forEach(
(exercise,exIndex)=>{

const [
name,
sets,
reps,
type
] = exercise;

const previous =
findLastExercise(
day.name,
name
);

const box =
document.createElement("div");

box.className =
"exercise";

if(type === "main"){

box.classList.add(
"main-ex"
);

}

if(type === "pre"){

box.classList.add(
"activation"
);

}

let badge = "";

if(type === "main"){

badge =
'<span class="badge badge-main">MAIN</span>';

}

if(type === "pre"){

badge =
'<span class="badge badge-pre">선행</span>';

}

let previousHTML =
'<div class="previous">지난 기록 없음</div>';

if(previous){

previousHTML = `

<div class="previous">

<strong>
지난 기록 · ${previous.date}
</strong>

<br>

${previous.sets
.map(formatSet)
.join("<br>")}

</div>

`;

}

let rows = "";

for(
let s = 0;
s < sets;
s++
){

const ds =
draft?.exercises?.[exIndex]
?.sets?.[s]
|| {};

rows += `

<div class="set-row">

<div class="set-num">
${s+1}
</div>

<input
type="number"
step="0.5"
inputmode="decimal"
placeholder="kg"
id="w-${exIndex}-${s}"
value="${escapeAttr(ds.weight || "")}"
>

<input
type="number"
inputmode="numeric"
placeholder="회"
id="r-${exIndex}-${s}"
value="${escapeAttr(ds.reps || "")}"
>

<input
type="number"
inputmode="numeric"
placeholder="RIR"
id="rir-${exIndex}-${s}"
value="${escapeAttr(ds.rir || "")}"
>

</div>

`;

}

box.innerHTML = `

<div class="exercise-head">

<div>

<div class="exercise-title">

${name}
${badge}

</div>

<div class="exercise-info">

${sets}세트 · ${reps}회

</div>

</div>

<button
class="link-btn"
onclick='openExerciseHistory(
${JSON.stringify(day.name)},
${JSON.stringify(name)}
)'
>

기록 보기

</button>

</div>

${previousHTML}

${previous
? `

<button
class="copy-last"
onclick='copyLast(
${exIndex},
${JSON.stringify(day.name)},
${JSON.stringify(name)}
)'
>

지난 기록 불러오기

</button>

`
: ""
}

<div class="headers">

<div></div>

<div>KG</div>

<div>REPS</div>

<div>RIR</div>

</div>

${rows}

`;

list.appendChild(box);

});

}

function collectWorkout(){

const day =
routine[currentDay];

const exercises = [];

day.exercises.forEach(
(exercise,exIndex)=>{

const [name,sets] =
exercise;

const setData = [];

for(
let s = 0;
s < sets;
s++
){

setData.push({

weight:
document
.getElementById(
`w-${exIndex}-${s}`
).value,

reps:
document
.getElementById(
`r-${exIndex}-${s}`
).value,

rir:
document
.getElementById(
`rir-${exIndex}-${s}`
).value

});

}

exercises.push({

name,
sets:setData

});

});

return{

day:day.name,
exercises

};

}

function saveDraft(){

const day =
routine[currentDay];

if(
day.exercises.length === 0
){

return;

}

const data =
collectWorkout();

data.savedAt =
new Date()
.toLocaleString("ko-KR");

setDraft(
day.name,
data
);

document
.getElementById("status")
.innerText =
"✓ 임시저장 완료";

document
.getElementById("draftBadge")
.innerText =
`임시저장됨 · ${data.savedAt}`;

}

function hasAnyEntry(
session
){

return session.exercises.some(
ex =>
ex.sets.some(
s =>
s.weight ||
s.reps ||
s.rir
)
);

}

function completeWorkout(){

if(isCompleting){

return;

}

const day =
routine[currentDay];

if(
day.exercises.length === 0
){

currentDay =
(currentDay + 1)
% routine.length;

localStorage.setItem(
"currentDay7",
currentDay
);

document
.getElementById("status")
.innerText =
"✓ 휴식 완료";

render();

window.scrollTo(
0,
0
);

return;

}

const session =
collectWorkout();

if(
!hasAnyEntry(session)
){

if(
!confirm(
"입력된 기록이 없습니다. 그래도 완료할까요?"
)
){

return;

}

}

isCompleting = true;

const btn =
document.getElementById(
"completeBtn"
);

btn.disabled = true;

btn.innerText =
"저장 중...";

const now =
Date.now();

session.ts = now;

session.id =
`${session.day}-${now}`;

session.date =
new Date(now)
.toLocaleString("ko-KR");

const history =
getHistory();

const last =
history[
history.length - 1
];

const duplicate =
last &&
last.day === session.day &&
Math.abs(
(last.ts || 0) -
now
) < 10000;

if(!duplicate){

history.push(
session
);

setHistory(
history
);

}

clearDraft(
session.day
);

currentDay =
(currentDay + 1)
% routine.length;

localStorage.setItem(
"currentDay7",
currentDay
);

document
.getElementById("status")
.innerText =
duplicate
? "중복 저장 방지"
: "✓ 최종 기록 저장 완료";

setTimeout(()=>{

isCompleting = false;

btn.disabled = false;

btn.innerText =
"운동 완료 → 다음 DAY";

render();

window.scrollTo({
top:0,
behavior:"smooth"
});

},300);

}

function copyLast(
exIndex,
dayName,
exerciseName
){

const prev =
findLastExercise(
dayName,
exerciseName
);

if(!prev){

return;

}

prev.sets.forEach(
(s,i)=>{

const w =
document.getElementById(
`w-${exIndex}-${i}`
);

const r =
document.getElementById(
`r-${exIndex}-${i}`
);

const rir =
document.getElementById(
`rir-${exIndex}-${i}`
);

if(w){

w.value =
s.weight || "";

}

if(r){

r.value =
s.reps || "";

}

if(rir){

rir.value =
s.rir || "";

}

});

saveDraft();

}

function openExerciseHistory(
dayName,
exerciseName
){

const records =
getExerciseHistory(
dayName,
exerciseName
)
.slice()
.reverse();

document
.getElementById("historyTitle")
.innerText =
exerciseName;

const content =
document.getElementById(
"historyContent"
);

if(
records.length === 0
){

content.innerHTML = `

<div class="empty">
아직 기록 없음
</div>

`;

}else{

const recent =
records.slice(
0,
5
);

content.innerHTML = `

<div class="section-title">
최고 중량 변화
</div>

<canvas
id="progressChart"
width="600"
height="180"
></canvas>

<div class="section-title">
최근 ${recent.length}회
</div>

${recent.map(
rec => `

<div class="history-row">

<div class="history-date">
${rec.date}
</div>

<div class="history-sets">

${rec.sets
.map(formatSet)
.join("<br>")}

</div>

</div>

`
).join("")}

<div class="section-title">
전체 기록 (${records.length}회)
</div>

${records.map(
rec => `

<div class="history-row">

<div class="history-date">
${rec.date}
</div>

<div class="history-sets">

${rec.sets
.map(formatSet)
.join("<br>")}

</div>

</div>

`
).join("")}

`;

setTimeout(
()=>drawChart(
records.slice().reverse()
),
30
);

}

document
.getElementById("historyModal")
.classList.add("show");

}

function bestWeight(
record
){

let max = 0;

record.sets.forEach(
s=>{

const w =
parseFloat(
s.weight
);

if(
Number.isFinite(w)
&&
w > max
){

max = w;

}

});

return max;

}

function drawChart(
records
){

const canvas =
document.getElementById(
"progressChart"
);

if(!canvas){

return;

}

const ctx =
canvas.getContext("2d");

const dpr =
window.devicePixelRatio || 1;

const width =
canvas.clientWidth || 600;

const height =
180;

canvas.width =
width * dpr;

canvas.height =
height * dpr;

ctx.scale(
dpr,
dpr
);

const vals =
records
.map(bestWeight)
.filter(v => v > 0);

ctx.clearRect(
0,
0,
width,
height
);

if(
vals.length === 0
){

ctx.fillStyle =
"#777";

ctx.font =
"13px sans-serif";

ctx.fillText(
"중량 데이터 없음",
18,
32
);

return;

}

const left = 38;
const right = 16;
const top = 16;
const bottom = 28;

const min =
Math.min(...vals);

const max =
Math.max(...vals);

const span =
Math.max(
1,
max - min
);

const x =
i =>
left +
(
i /
Math.max(
1,
vals.length - 1
)
)
*
(
width -
left -
right
);

const y =
v =>
top +
(
1 -
(v - min) / span
)
*
(
height -
top -
bottom
);

ctx.strokeStyle =
"#2f3540";

ctx.lineWidth = 1;

ctx.beginPath();

ctx.moveTo(
left,
top
);

ctx.lineTo(
left,
height-bottom
);

ctx.lineTo(
width-right,
height-bottom
);

ctx.stroke();

ctx.strokeStyle =
"#3a86ff";

ctx.lineWidth =
2.5;

ctx.beginPath();

vals.forEach(
(v,i)=>{

if(i === 0){

ctx.moveTo(
x(i),
y(v)
);

}else{

ctx.lineTo(
x(i),
y(v)
);

}

});

ctx.stroke();

ctx.fillStyle =
"#70a7ff";

vals.forEach(
(v,i)=>{

ctx.beginPath();

ctx.arc(
x(i),
y(v),
3.5,
0,
Math.PI*2
);

ctx.fill();

});

ctx.fillStyle =
"#9aa7bd";

ctx.font =
"11px sans-serif";

ctx.fillText(
`${max}kg`,
3,
top+4
);

ctx.fillText(
`${min}kg`,
3,
height-bottom
);

}

function openSessionHistory(){

const history =
getHistory()
.slice()
.reverse();

document
.getElementById("historyTitle")
.innerText =
"전체 운동 기록";

const content =
document.getElementById(
"historyContent"
);

if(
history.length === 0
){

content.innerHTML = `

<div class="empty">
아직 저장된 운동 없음
</div>

`;

}else{

content.innerHTML =
history.map(
session => `

<div class="history-row">

<div class="history-date">
${session.date}
</div>

<div
style="
font-weight:900;
margin-bottom:6px;
"
>

${session.day}

</div>

<div class="history-sets">

${(session.exercises || [])
.map(
ex => {

const entered =
(ex.sets || [])
.filter(
x =>
x.weight ||
x.reps ||
x.rir
);

if(
entered.length === 0
){

return "";

}

return `

<b>
${ex.name}
</b>

<br>

${entered
.map(formatSet)
.join("<br>")}

`;

}
)
.filter(Boolean)
.join("<br><br>")}

</div>

</div>

`
)
.join("");

}

document
.getElementById("historyModal")
.classList.add("show");

}

function closeModal(){

document
.getElementById("historyModal")
.classList.remove("show");

}

function modalBackgroundClose(e){

if(
e.target.id ===
"historyModal"
){

closeModal();

}

}

function exportData(){

const payload = {

exportedAt:
new Date()
.toISOString(),

currentDay,

workoutHistory:
getHistory()

};

const data =
JSON.stringify(
payload,
null,
2
);

const blob =
new Blob(
[data],
{
type:"application/json"
}
);

const file =
new File(
[blob],
"workout-backup.json",
{
type:"application/json"
}
);

if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

navigator.share({

title:"Workout Backup",

files:[file]

})
.catch(()=>{});

}else{

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"workout-backup.json";

a.click();

setTimeout(
()=>URL.revokeObjectURL(a.href),
1000
);

}

}

function restoreData(event){

const file =
event.target.files?.[0];

if(!file){

return;

}

const reader =
new FileReader();

reader.onload = ()=>{

try{

const data =
JSON.parse(
reader.result
);

const history =
Array.isArray(data)
? data
: data.workoutHistory;

if(
!Array.isArray(history)
){

throw new Error();

}

if(
!confirm(
`백업 기록 ${history.length}개를 복원할까요?`
)
){

return;

}

setHistory(
history
);

if(
!Array.isArray(data)
&&
Number.isInteger(
data.currentDay
)
){

currentDay =
Math.max(
0,
Math.min(
routine.length - 1,
data.currentDay
)
);

localStorage.setItem(
"currentDay7",
currentDay
);

}

document
.getElementById("status")
.innerText =
"✓ 백업 복원 완료";

render();

}catch{

alert(
"백업 파일을 읽을 수 없습니다."
);

}finally{

event.target.value = "";

}

};

reader.readAsText(
file
);

}

render();

</script>
