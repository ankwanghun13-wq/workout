<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MY WORKOUT">
<title>MY WORKOUT</title>
<style>
:root{
  --bg:#0d0f14;--card:#171a21;--card2:#111318;--line:#292d37;
  --text:#fff;--muted:#8f98a8;--blue:#3a86ff;--green:#67d391;--warn:#ffcc66;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:680px;margin:auto;padding:18px 14px 100px}
h1{margin:4px 0;font-size:30px}
.subtitle{color:#999;margin-bottom:18px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.small-btn{border:1px solid var(--line);background:#171a21;color:#d9deea;border-radius:10px;padding:9px 12px;font-weight:700}
.day-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}
.day-btn{flex:0 0 auto;border:none;border-radius:12px;padding:10px 14px;background:#1b1e26;color:#aaa;font-weight:800}
.day-btn.active{background:var(--blue);color:white}
.today-card{background:linear-gradient(135deg,#17233b,#11151f);border:1px solid #263b63;padding:18px;border-radius:18px;margin-bottom:18px}
.today-card .small{color:#9aa7bd;font-size:13px}
.today-title{font-size:28px;font-weight:900;margin:5px 0}
.draft-badge{font-size:12px;color:var(--warn);margin-top:6px;min-height:15px}
.exercise{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px}
.exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exercise-title{font-size:18px;font-weight:900}
.exercise-info{font-size:13px;color:var(--muted);margin:4px 0 10px}
.link-btn{border:1px solid #364056;background:#10131a;color:#8fb7ff;border-radius:9px;padding:7px 9px;font-weight:700;font-size:12px}
.previous{background:var(--card2);padding:10px 11px;border-radius:10px;margin-bottom:10px;color:#aeb6c5;font-size:13px;line-height:1.55}
.previous strong{color:#70a7ff}
.copy-last{width:100%;border:1px solid #343a47;background:#12151b;color:#c8cfdd;border-radius:9px;padding:8px;margin:-2px 0 10px;font-weight:700}
.headers,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:6px;align-items:center}
.headers{color:#777;font-size:11px;text-align:center;margin-bottom:5px}
.set-row{margin-bottom:8px}
.set-num{color:#888;font-size:13px}
input{width:100%;min-width:0;padding:10px 5px;text-align:center;border-radius:9px;border:1px solid #333845;background:#0d0f14;color:white;font-size:16px}
button.main{width:100%;border:none;border-radius:14px;padding:16px;margin-top:10px;font-size:17px;font-weight:900}
.save-btn{background:#272c36;color:white}
.complete-btn{background:var(--blue);color:white}
.status{text-align:center;color:var(--green);min-height:22px;margin:14px 0;font-size:14px}
.bottom-info{color:#666;text-align:center;font-size:12px;margin-top:26px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:1000;padding:18px;overflow:auto}
.modal.show{display:block}
.modal-card{max-width:650px;margin:24px auto;background:#14171d;border:1px solid #2d323d;border-radius:18px;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-title{font-size:20px;font-weight:900}
.close-btn{border:none;background:#282d36;color:white;border-radius:10px;padding:8px 11px;font-weight:800}
.history-row{background:#0f1116;border:1px solid #272c35;border-radius:12px;padding:11px;margin:9px 0}
.history-date{color:#8f98a8;font-size:12px;margin-bottom:5px}
.history-sets{font-size:13px;line-height:1.55;color:#d8deea}
canvas{width:100%;height:180px;background:#0d0f14;border:1px solid #292d37;border-radius:12px;margin:12px 0}
.section-title{font-weight:900;margin:14px 0 8px}
.empty{color:#777;text-align:center;padding:24px 0}
</style>
</head>
<body>
<div class="container">
  <h1>MY WORKOUT</h1>
  <div class="subtitle">Rolling 5 Split · 근비대 기록</div>

  <div class="top-actions">
    <button class="small-btn" onclick="openSessionHistory()">전체 기록</button>
    <button class="small-btn" onclick="exportData()">백업</button>
    <label class="small-btn" style="cursor:pointer">
      복원
      <input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)">
    </label>
  </div>

  <div class="day-tabs" id="tabs"></div>

  <div class="today-card">
    <div class="small">CURRENT WORKOUT</div>
    <div class="today-title" id="dayTitle"></div>
    <div id="daySub"></div>
    <div class="draft-badge" id="draftBadge"></div>
  </div>

  <div id="exerciseList"></div>

  <button class="main save-btn" onclick="saveDraft()">현재 기록 임시저장</button>
  <button class="main complete-btn" id="completeBtn" onclick="completeWorkout()">운동 완료 → 다음 DAY</button>

  <div class="status" id="status"></div>
  <div class="bottom-info">임시저장은 최종 기록에 추가되지 않습니다.<br>운동 완료를 눌렀을 때만 1회 기록으로 저장됩니다.</div>
</div>

<div class="modal" id="historyModal" onclick="modalBackgroundClose(event)">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="historyTitle">기록</div>
      <button class="close-btn" onclick="closeModal()">닫기</button>
    </div>
    <div id="historyContent"></div>
  </div>
</div>

<script>
const routine=[
{name:"PUSH",sub:"가슴 + 어깨 + 삼두",exercises:[
["스미스 인클라인 프레스",3,"6~10"],["체스트프레스 머신",3,"8~12"],["펙덱 플라이",2,"10~15"],
["숄더프레스 머신",3,"6~10"],["케이블 사이드 레터럴",3,"12~20"],["오버헤드 트라이셉스 익스텐션",2,"10~15"],["케이블 푸시다운",2,"10~15"]]},
{name:"PULL",sub:"등 + 후면 + 이두",exercises:[
["어시스트 풀업",3,"6~10"],["한팔 케이블 하이로우",3,"8~12"],["케이블 로우",3,"8~12"],["한팔 케이블 광배 로우",2,"10~15"],
["스트레이트암 풀다운",2,"10~15"],["케이블 Y-레이즈",2,"12~20"],["리어델트 머신",3,"12~20"],["이두 머신",3,"8~12"],["케이블 해머컬",2,"10~15"]]},
{name:"LEGS A",sub:"대퇴사두 우선",exercises:[
["V스쿼트",4,"6~10"],["레그프레스",3,"10~15"],["레그익스텐션",3,"10~15"],["라잉 레그컬",3,"8~15"],["아웃타이",3,"12~20"],["카프레이즈",3,"8~15"]]},
{name:"UPPER",sub:"상체 2차 자극",exercises:[
["체스트프레스 / 스미스 인클라인",3,"8~12"],["펙덱 플라이",2,"12~15"],["어시스트 풀업 / 케이블 풀다운",3,"8~12"],["한팔 광배 케이블로우",3,"10~15"],
["케이블 사이드 레터럴",3,"12~20"],["리어델트 머신",2,"15~25"],["케이블 컬",2,"10~15"],["케이블 푸시다운",2,"10~15"]]},
{name:"LEGS B",sub:"햄스트링 + 둔근 우선",exercises:[
["스미스 RDL",4,"6~10"],["힙쓰러스트",3,"8~12"],["라잉 레그컬",3,"10~15"],["레그프레스 (발 위)",3,"10~15"],
["V스쿼트 가볍게",2,"10~15"],["아웃타이",2,"15~25"],["카프레이즈",3,"10~15"]]}
];

let currentDay=Number(localStorage.getItem("currentDay")||0);
let isCompleting=false;

function getHistory(){try{return JSON.parse(localStorage.getItem("workoutHistory")||"[]")}catch{return[]}}
function setHistory(h){localStorage.setItem("workoutHistory",JSON.stringify(h))}
function draftKey(day){return "draft_"+day.replace(/\s+/g,"_")}
function getDraft(day){try{return JSON.parse(localStorage.getItem(draftKey(day))||"null")}catch{return null}}
function setDraft(day,data){localStorage.setItem(draftKey(day),JSON.stringify(data))}
function clearDraft(day){localStorage.removeItem(draftKey(day))}
function fmt(s,i){return `${i+1}세트 ${s.weight||"-"}kg × ${s.reps||"-"}회 · RIR ${s.rir||"-"}`}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function renderTabs(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  routine.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="day-btn"+(i===currentDay?" active":"");
    b.innerText=d.name;
    b.onclick=()=>{currentDay=i;localStorage.setItem("currentDay",i);render()};
    tabs.appendChild(b);
  });
}

function getExerciseHistory(dayName,exerciseName){
  return getHistory().filter(s=>s.day===dayName).map(s=>{
    const ex=(s.exercises||[]).find(e=>e.name===exerciseName);
    return ex?{date:s.date,ts:s.ts||0,sets:ex.sets||[]}:null;
  }).filter(Boolean);
}
function lastExercise(dayName,exerciseName){
  const a=getExerciseHistory(dayName,exerciseName);
  return a.length?a[a.length-1]:null;
}

function render(){
  renderTabs();
  const day=routine[currentDay];
  document.getElementById("dayTitle").innerText=day.name;
  document.getElementById("daySub").innerText=day.sub;

  const draft=getDraft(day.name);
  document.getElementById("draftBadge").innerText=draft?`임시저장됨 · ${draft.savedAt||""}`:"";

  const list=document.getElementById("exerciseList");list.innerHTML="";

  day.exercises.forEach((exercise,exIndex)=>{
    const [name,sets,reps]=exercise;
    const prev=lastExercise(day.name,name);
    const box=document.createElement("div");
    box.className="exercise";

    let prevHtml='<div class="previous">지난 기록 없음</div>';
    if(prev){
      prevHtml=`<div class="previous"><strong>지난 기록 · ${prev.date}</strong><br>${prev.sets.map(fmt).join("<br>")}</div>`;
    }

    let rows="";
    for(let s=0;s<sets;s++){
      const ds=draft?.exercises?.[exIndex]?.sets?.[s]||{};
      rows+=`<div class="set-row">
        <div class="set-num">${s+1}</div>
        <input type="number" step="0.5" inputmode="decimal" placeholder="kg" id="w-${exIndex}-${s}" value="${esc(ds.weight||"")}">
        <input type="number" inputmode="numeric" placeholder="회" id="r-${exIndex}-${s}" value="${esc(ds.reps||"")}">
        <input type="number" inputmode="numeric" placeholder="RIR" id="rir-${exIndex}-${s}" value="${esc(ds.rir||"")}">
      </div>`;
    }

    box.innerHTML=`
      <div class="exercise-head">
        <div><div class="exercise-title">${name}</div><div class="exercise-info">${sets}세트 · ${reps}회</div></div>
        <button class="link-btn" onclick='openExerciseHistory(${JSON.stringify(day.name)},${JSON.stringify(name)})'>기록 보기</button>
      </div>
      ${prevHtml}
      ${prev?`<button class="copy-last" onclick='copyLast(${exIndex},${JSON.stringify(day.name)},${JSON.stringify(name)})'>지난 기록 불러오기</button>`:""}
      <div class="headers"><div></div><div>KG</div><div>REPS</div><div>RIR</div></div>
      ${rows}`;
    list.appendChild(box);
  });
}

function collectWorkout(){
  const day=routine[currentDay],exercises=[];
  day.exercises.forEach((ex,exIndex)=>{
    const [name,sets]=ex,setData=[];
    for(let s=0;s<sets;s++){
      setData.push({
        weight:document.getElementById(`w-${exIndex}-${s}`).value,
        reps:document.getElementById(`r-${exIndex}-${s}`).value,
        rir:document.getElementById(`rir-${exIndex}-${s}`).value
      });
    }
    exercises.push({name,sets:setData});
  });
  return{day:day.name,exercises};
}

function saveDraft(){
  const day=routine[currentDay],data=collectWorkout();
  data.savedAt=new Date().toLocaleString("ko-KR");
  setDraft(day.name,data);
  document.getElementById("status").innerText="✓ 임시저장 완료";
  document.getElementById("draftBadge").innerText=`임시저장됨 · ${data.savedAt}`;
}

function hasAnyEntry(s){return s.exercises.some(ex=>ex.sets.some(x=>x.weight||x.reps||x.rir))}

function completeWorkout(){
  if(isCompleting)return;
  const session=collectWorkout();
  if(!hasAnyEntry(session)&&!confirm("입력된 기록이 없습니다. 그래도 완료로 저장할까요?"))return;

  isCompleting=true;
  const btn=document.getElementById("completeBtn");
  btn.disabled=true;btn.innerText="저장 중...";

  const now=Date.now();
  session.ts=now;session.id=`${session.day}-${now}`;session.date=new Date(now).toLocaleString("ko-KR");

  const history=getHistory(),last=history[history.length-1];
  const duplicate=last&&last.day===session.day&&Math.abs((last.ts||0)-now)<10000;

  if(!duplicate){history.push(session);setHistory(history)}
  clearDraft(session.day);

  currentDay=(currentDay+1)%routine.length;
  localStorage.setItem("currentDay",currentDay);

  document.getElementById("status").innerText=duplicate?"중복 저장을 막았습니다.":"✓ 최종 기록 저장 완료";
  setTimeout(()=>{
    isCompleting=false;btn.disabled=false;btn.innerText="운동 완료 → 다음 DAY";
    render();window.scrollTo({top:0,behavior:"smooth"});
  },300);
}

function copyLast(exIndex,dayName,exerciseName){
  const prev=lastExercise(dayName,exerciseName);if(!prev)return;
  prev.sets.forEach((s,i)=>{
    const w=document.getElementById(`w-${exIndex}-${i}`);
    const r=document.getElementById(`r-${exIndex}-${i}`);
    const rr=document.getElementById(`rir-${exIndex}-${i}`);
    if(w)w.value=s.weight||"";if(r)r.value=s.reps||"";if(rr)rr.value=s.rir||"";
  });
  saveDraft();
}

function openExerciseHistory(dayName,exerciseName){
  const records=getExerciseHistory(dayName,exerciseName).slice().reverse();
  document.getElementById("historyTitle").innerText=exerciseName;
  const c=document.getElementById("historyContent");
  if(!records.length){
    c.innerHTML='<div class="empty">아직 저장된 기록이 없습니다.</div>';
  }else{
    const recent=records.slice(0,5);
    c.innerHTML=`
      <div class="section-title">최고 중량 변화</div>
      <canvas id="progressChart" width="600" height="180"></canvas>
      <div class="section-title">최근 ${recent.length}회</div>
      ${recent.map(r=>`<div class="history-row"><div class="history-date">${r.date}</div><div class="history-sets">${r.sets.map(fmt).join("<br>")}</div></div>`).join("")}
      <div class="section-title">전체 기록 (${records.length}회)</div>
      ${records.map(r=>`<div class="history-row"><div class="history-date">${r.date}</div><div class="history-sets">${r.sets.map(fmt).join("<br>")}</div></div>`).join("")}`;
    setTimeout(()=>drawChart(records.slice().reverse()),30);
  }
  document.getElementById("historyModal").classList.add("show");
}

function bestWeight(record){
  let m=0;
  record.sets.forEach(s=>{const w=parseFloat(s.weight);if(Number.isFinite(w)&&w>m)m=w});
  return m;
}

function drawChart(records){
  const canvas=document.getElementById("progressChart");if(!canvas)return;
  const ctx=canvas.getContext("2d"),dpr=window.devicePixelRatio||1,cssW=canvas.clientWidth||600,cssH=180;
  canvas.width=cssW*dpr;canvas.height=cssH*dpr;ctx.scale(dpr,dpr);

  const vals=records.map(bestWeight).filter(v=>v>0);
  ctx.clearRect(0,0,cssW,cssH);
  if(!vals.length){ctx.fillStyle="#777";ctx.font="13px sans-serif";ctx.fillText("중량 데이터가 없습니다.",18,32);return}

  const l=38,r=16,t=16,b=28,min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);
  const x=i=>l+(i/Math.max(1,vals.length-1))*(cssW-l-r);
  const y=v=>t+(1-(v-min)/span)*(cssH-t-b);

  ctx.strokeStyle="#2f3540";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(l,t);ctx.lineTo(l,cssH-b);ctx.lineTo(cssW-r,cssH-b);ctx.stroke();
  ctx.strokeStyle="#3a86ff";ctx.lineWidth=2.5;ctx.beginPath();
  vals.forEach((v,i)=>i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v)));ctx.stroke();

  ctx.fillStyle="#70a7ff";
  vals.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),3.5,0,Math.PI*2);ctx.fill()});

  ctx.fillStyle="#9aa7bd";ctx.font="11px sans-serif";
  ctx.fillText(`${max}kg`,3,t+4);ctx.fillText(`${min}kg`,3,cssH-b);
  ctx.fillText("1",l-2,cssH-8);ctx.fillText(`${vals.length}`,cssW-r-8,cssH-8);
}

function openSessionHistory(){
  const history=getHistory().slice().reverse();
  document.getElementById("historyTitle").innerText="전체 운동 기록";
  const c=document.getElementById("historyContent");

  if(!history.length){
    c.innerHTML='<div class="empty">아직 저장된 운동이 없습니다.</div>';
  }else{
    c.innerHTML=history.map(s=>`<div class="history-row">
      <div class="history-date">${s.date}</div>
      <div style="font-weight:900;margin-bottom:6px">${s.day}</div>
      <div class="history-sets">
        ${(s.exercises||[]).map(ex=>{
          const entered=(ex.sets||[]).filter(x=>x.weight||x.reps||x.rir);
          if(!entered.length)return "";
          return `<b>${ex.name}</b><br>${entered.map(fmt).join("<br>")}`;
        }).filter(Boolean).join("<br><br>")}
      </div>
    </div>`).join("");
  }
  document.getElementById("historyModal").classList.add("show");
}

function closeModal(){document.getElementById("historyModal").classList.remove("show")}
function modalBackgroundClose(e){if(e.target.id==="historyModal")closeModal()}

function exportData(){
  const payload={exportedAt:new Date().toISOString(),currentDay,workoutHistory:getHistory()};
  const data=JSON.stringify(payload,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const file=new File([blob],"workout-backup.json",{type:"application/json"});

  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({title:"Workout Backup",files:[file]}).catch(()=>{});
  }else{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="workout-backup.json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
}

function restoreData(event){
  const file=event.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const hist=Array.isArray(data)?data:data.workoutHistory;
      if(!Array.isArray(hist))throw new Error();

      if(!confirm(`백업 기록 ${hist.length}개를 복원할까요? 현재 기록은 교체됩니다.`))return;

      setHistory(hist);
      if(!Array.isArray(data)&&Number.isInteger(data.currentDay)){
        currentDay=Math.max(0,Math.min(routine.length-1,data.currentDay));
        localStorage.setItem("currentDay",currentDay);
      }
      document.getElementById("status").innerText="✓ 백업 복원 완료";
      render();
    }catch{
      alert("백업 파일을 읽을 수 없습니다.");
    }finally{
      event.target.value="";
    }
  };
  reader.readAsText(file);
}

render();
</script>
</body>
</html>
